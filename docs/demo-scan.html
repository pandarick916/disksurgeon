  #glow{position:fixed;inset:0;pointer-events:none;z-index:1;
    background:
      radial-gradient(680px 420px at 20% 6%, rgba(34,211,238,.075), transparent 70%),
      radial-gradient(760px 500px at 84% 94%, rgba(59,130,246,.065), transparent 72%),
      radial-gradient(420px 320px at 50% 50%, rgba(255,90,95,.03), transparent 75%);

  #beam{position:fixed;left:0;right:0;height:2px;top:-2px;pointer-events:none;z-index:2;
    background:linear-gradient(90deg,transparent,rgba(34,211,238,.55),transparent);
    opacity:0;animation:beam 3.2s ease-in-out infinite}
  @keyframes beam{
    0%{top:-2px;opacity:0}
    12%{opacity:.9}
    50%{top:100%;opacity:.35}
    62%,100%{top:100%;opacity:0}
  }

  #top{position:fixed;top:0;left:0;right:0;height:92px;padding:20px 28px 0;

  #path{font-size:13px;color:var(--dim);letter-spacing:.02em;white-space:nowrap;

  .stat b{display:block;font-size:21px;font-weight:700;letter-spacing:-.01em;

  .stat span{display:block;font-size:11px;color:var(--faint);letter-spacing:.06em;margin-top:2px}

    background:linear-gradient(180deg,rgba(17,24,35,.92),rgba(17,24,35,.78));
    border:1px solid var(--line);border-radius:12px;padding:14px 0 8px;
    backdrop-filter:blur(14px)}
  #rank h3{font-size:11px;letter-spacing:.14em;color:var(--faint);font-weight:600;

    flex-direction:column;gap:16px;background:var(--bg);z-index:20;transition:opacity .45s}

    border-radius:50%;animation:sp .75s linear infinite}

</style>

    // 明度随层级递增 + 相邻兄弟奇偶错开：
    // 不然像 C 盘这种「Users 一块占掉半张图」的情况，里面整片糊成一个色，
    // 层级完全读不出来 —— 而层级正是这个图唯一的价值。
    ctx.fillStyle = rgba(c, idx % 2 ? .17 : .12);
    ctx.fillRect(rx, ry, rw, rh);
    if (rw > 34 && rh > 24){
      ctx.strokeStyle = rgba(c, .30); ctx.lineWidth = .7;
      ctx.strokeRect(rx+.35, ry+.35, rw-.7, rh-.7);
    }
  } else {
    ctx.fillStyle = rgba(c, idx % 2 ? .25 : .19);
    ctx.fillRect(rx, ry, rw, rh);
  }

  // 刚被扫描线扫过：短暂提亮，制造"被点亮"的瞬间
  if (flash > 0){
    ctx.fillStyle = `rgba(205,250,255,${flash})`;
    ctx.fillRect(rx, ry, rw, rh);
  }
  ctx.globalAlpha = 1;

  // 文字
  const fs = depth === 0
    ? Math.min(26, Math.max(10.5, rh*0.16))
    : Math.min(14, Math.max(9, rh*0.30));
  const minW = depth === 0 ? 44 : 62, minH = depth === 0 ? 22 : 15;
  // 第三层也标名字，但只标够大的：C 盘里 Users 一块吃掉半张图，
  // 真正想知道的东西（AppData、Documents…）全在第三层，不标就白画了。
  const labelable = depth <= 1 || (depth === 2 && rw >= 118 && rh >= 34);
  if (labelable && rw >= minW && rh >= minH && ap > .55){
    ctx.globalAlpha = ap;
    ctx.font = `${depth===0?700:600} ${fs}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
    ctx.textBaseline = 'top';
    const pad = Math.max(5, fs*0.4);
    const label = fitText(r.name, rw - pad*2);
    if (label){
      const lw = ctx.measureText(label).width;
      const showSize = depth === 0 ? rh > fs*2.7 : (rh > fs*2.6 && rw > 96);
      const blockH = fs*1.16*(showSize?2:1) + pad*1.2;
      const g2 = ctx.createLinearGradient(rx, ry, rx, ry+blockH+pad);
      g2.addColorStop(0, depth===0 ? 'rgba(8,11,17,.76)' : 'rgba(8,11,17,.60)');
      g2.addColorStop(1, 'rgba(8,11,17,0)');
      ctx.fillStyle = g2;
      ctx.fillRect(rx, ry, Math.min(rw, lw+pad*2.4), blockH+pad);

      ctx.fillStyle = depth===0
        ? (isSel||isHover ? '#FFFFFF' : 'rgba(236,242,248,.96)')
        : 'rgba(212,224,238,.9)';
      ctx.fillText(label, rx+pad, ry+pad*0.8);

      if (showSize){
        const fs2 = Math.max(9.5, fs*0.60);
        ctx.font = `600 ${fs2}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
        ctx.fillStyle = depth===0 ? rgba(c,.95) : 'rgba(150,166,186,.92)';
        ctx.fillText(human(r.size), rx+pad, ry+pad*0.8+fs*1.16);
      }
    }
    ctx.globalAlpha = 1;
  }

  if (depth >= MAX_DEPTH) return;
  const kids = (r.kids||[]).filter(k=>k.size>0);
  if (!kids.length || rw*rh < MIN_RECURSE || rw < 46 || rh < 26) return;

  const headH = Math.min(rh*0.42,
    (depth===0 ? Math.min(26, Math.max(10.5, rh*0.16)) : Math.min(14, Math.max(9, rh*0.30)))*1.5
    + (depth===0?12:8));
  const inset = depth===0 ? 2.4 : 1.6;
  const body = {x:rx+inset, y:ry+inset+(depth===0?headH:Math.min(headH, rh*0.3)),
    w:rw-inset*2, h:rh-inset*2-(depth===0?headH:Math.min(headH, rh*0.3))};
  if (body.w < 16 || body.h < 12) return;

  const take = kids.slice(0, MAX_KIDS[depth]);
  const items = take.map(k=>({name:k.name, size:k.size, children:k.children, path:k.path}));
  const shown = take.reduce((s,k)=>s+k.size, 0);
  const rest = r.size - shown;
  if (rest > 0 && rest/r.size > 0.002) items.push({name:'其它', size:rest, children:null});

  const gap = depth===0 ? .8 : (depth===1 ? .7 : 0);
  squarify(items, body, gap).forEach((q,j)=>paintNode(q, el, depth+1, idx+j+1, c));
}

/* draw 返回 true = 还要继续画 */
function draw(){
  const now = performance.now();
  const el = now - t0;
  const st = clamp(el / SCAN_DUR, 0, 1);
  scanY = st >= 1 ? H + 400 : H * easeOut(st) * 1.02;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#080B11';
  ctx.fillRect(0,0,W,H);

  let busy = false;

  // 下钻穿越：整幅缩放
  if (zoom){
    const d = zoom.phase === 'out' ? 170 : 260;
    const k = clamp((now - zoom.t0)/d, 0, 1);
    let s, a;
    if (zoom.phase === 'out'){ s = 1 + 0.5*easeIn(k); a = 1 - k; }
    else { s = 0.80 + 0.20*easeOut(k); a = easeOut(k); }
    ctx.save();
    ctx.translate(zoom.cx, zoom.cy); ctx.scale(s, s); ctx.translate(-zoom.cx, -zoom.cy);
    ctx.globalAlpha = a;
    rects.forEach((r,i)=>paintNode(r, el, 0, i, null));
    ctx.restore();
    ctx.globalAlpha = 1;
    if (k >= 1){
      if (zoom.phase === 'out'){ zoom = {cx:zoom.cx, cy:zoom.cy, t0:now, phase:'in'}; }
      else { zoom = null; }
    }
    busy = true;
  } else {
    rects.forEach((r,i)=>paintNode(r, el, 0, i, null));
  }

  // 入场扫描线：宽光带 + 双亮芯 + 余辉，从上推到底
  if (st < 1.02 && !zoom){
    const y = scanY;
    // 拖尾光带（越高越淡）
    const g = ctx.createLinearGradient(0, y-260, 0, y+8);
    g.addColorStop(0,   'rgba(34,211,238,0)');
    g.addColorStop(.42, 'rgba(34,211,238,.13)');
    g.addColorStop(.78, 'rgba(96,232,252,.34)');
    g.addColorStop(.96, 'rgba(200,252,255,.66)');
    g.addColorStop(1,   'rgba(235,254,255,.92)');
    ctx.fillStyle = g;
    ctx.fillRect(0, Math.max(0, y-260), W, 268);
    // 亮芯（双层）
    ctx.fillStyle = 'rgba(240,254,255,.98)';
    ctx.fillRect(0, y, W, 2.2);
    ctx.fillStyle = 'rgba(34,211,238,.55)';
    ctx.fillRect(0, y-5, W, 1.2);
    // 底部扩散光（照亮即将出现的区域）
    const g2 = ctx.createLinearGradient(0, y, 0, y+64);
    g2.addColorStop(0, 'rgba(90,230,250,.20)');
    g2.addColorStop(1, 'rgba(34,211,238,0)');
    ctx.fillStyle = g2;
    ctx.fillRect(0, y, W, 64);
    busy = true;
  }

  if (el < SCAN_DUR + 420) busy = true;
  if (forceFrames > 0){ forceFrames--; busy = true; }
  return busy;
}

function tick(){
  const busy = draw();
  rafId = busy ? requestAnimationFrame(tick) : null;
}
function kick(frames){
  forceFrames = Math.max(forceFrames, frames||1);
  if (rafId === null) rafId = requestAnimationFrame(tick);
}

/* ───────── HUD ───────── */
let sizeAnim = null, sizeTimer = null, firstHud = true;
function rollNumber(el, to, fmt, delay){
  if (sizeTimer){ clearTimeout(sizeTimer); sizeTimer = null; }
  if (sizeAnim){ cancelAnimationFrame(sizeAnim); sizeAnim = null; }
  const start = ()=>{
    const t = performance.now(), dur = 900;
    const step = ()=>{
      const k = clamp((performance.now()-t)/dur, 0, 1);
      el.textContent = fmt((to)*easeOut(k));
      if (k < 1) sizeAnim = requestAnimationFrame(step); else sizeAnim = null;
    };
    step();
  };
  if (delay && delay > 0) sizeTimer = setTimeout(start, delay); else start();
}

function updateHud(){
  const node = currentNode(); if (!node) return;
  const total = DATA.total_size || 1;
  document.getElementById('path').textContent =
    stack.length > 1 ? stack.map(n=>n.name).join('  ›  ') : DATA.root;
  document.getElementById('title').innerHTML =
    esc(node.name) + (stack.length > 1
      ? `<span class="pct">${(node.size/total*100).toFixed(1)}% · ${human(node.size)}</span>`
      : `<span class="pct">磁盘总占用 ${human(node.size)}</span>`);
  rollNumber(document.getElementById('s-size'), DATA.total_size, v=>human(v),
             firstHud ? 640 : 0);
  firstHud = false;
  document.getElementById('s-files').textContent = (DATA.total_files||0).toLocaleString();
  document.getElementById('s-time').textContent = (DATA.elapsed_sec||0)+'s';
  renderRank();
}
function esc(s){ return String(s).replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

function renderRank(){
  const node = currentNode();
  const kids = ((node && node.children)||[]).slice().sort((a,b)=>b.size-a.size).slice(0,10);
  const box = document.getElementById('rank-list');
  const max = kids.length ? kids[0].size : 1;
  box.innerHTML = kids.map((k,i)=>{
    const c = colorOf(k.size);
    return `<div class="row" data-i="${i}" title="${esc(k.path||'')}">
      <span class="dot" style="background:${c}"></span>
      <span class="nm">${esc(k.name)}</span>
      <span class="sz">${human(k.size)}</span></div>
    <div class="bar" style="background:${c};width:${Math.max(2,(k.size/max)*100)}%"></div>`;
  }).join('') || '<div class="row" style="color:#4A5A70;font-size:12px">空</div>';

  box.querySelectorAll('.row').forEach(el=>{
    el.onclick = ()=>{
      const k = kids[+el.dataset.i];
      if (k) { selectByNode(k); }
    };
  });
}

/* ───────── 选中 + 操作条 ───────── */
const act = document.getElementById('act');
let selNode = null, selRisk = 'normal';

const DEFAULT_LABEL = {enter:'进入下一层', clean:'复制清理指令',
                       move:'复制搬家指令', path:'复制路径'};

/* 风险判定：不能给小白一个"清理整个 Windows"的按钮 */
function riskOf(r){
  const p = (r.path || '').replace(/\//g, '\\').toLowerCase().replace(/\\+$/, '');
  const seg = p.split('\\');
  const FORBID = ['windows','program files','program files (x86)','programdata',
                  'system volume information','$recycle.bin','recovery','winre.wim'];
  if (seg.some(s => FORBID.includes(s))) return 'forbidden';
  // 容器型目录：里面能清，但不能整体清/搬
  if ((r.name||'').toLowerCase() === 'appdata') return 'caution';
  return 'normal';
}

function showAct(r){
  selNode = r;
  selRisk = riskOf(r);
  act.querySelector('.nm').textContent = r.name;
  act.querySelector('.sz').textContent = human(r.size);
  act.querySelector('.sz').style.color = colorOf(r.size);
  act.querySelector('.pt').textContent = r.path || '';

  const isDir = !!(r.kids && r.kids.length);
  const bE = act.querySelector('[data-act="enter"]');
  const bC = act.querySelector('[data-act="clean"]');
  const bM = act.querySelector('[data-act="move"]');

  bE.style.display = isDir ? '' : 'none';
  bM.style.display = isDir ? '' : 'none';

  bC.disabled = bM.disabled = false;
  bC.textContent = DEFAULT_LABEL.clean;
  bM.textContent = DEFAULT_LABEL.move;

  if (selRisk === 'forbidden'){
    bC.textContent = '系统目录 · 不能清理'; bC.disabled = true;
    bM.textContent = '系统目录 · 不能搬家'; bM.disabled = true;
  } else if (selRisk === 'caution'){
    bC.textContent = '看看里面哪些能清';
    bM.textContent = '看看里面哪些能搬';
  }

  act.classList.add('on');
  document.getElementById('hint').style.opacity = '0';
  kick(6);
}
function closeAct(){
  act.classList.remove('on');
  selNode = null;
  document.getElementById('hint').style.opacity = '1';
  kick(4);
}
function selectByNode(k){
  // 从榜单点击：找到对应 rect
  const i = rects.findIndex(r=>r.name===k.name && r.path===k.path);
  if (i >= 0){ selIdx = i; hoverIdx = -1; showAct(rects[i]); }
  else {
    const fake = {name:k.name, path:k.path, size:k.size, kids:k.children};
    selIdx = -1; showAct(fake);
  }
}

async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch(e){
    try {
      const ta = document.createElement('textarea');
      ta.value = t; ta.style.cssText = 'position:fixed;opacity:0;left:-9999px';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta); return ok;
    } catch(e2){ return false; }
  }
}

act.addEventListener('click', async e=>{
  const btn = e.target.closest('button'); if (!btn || !selNode) return;
  const kind = btn.dataset.act;
  const p = selNode.path || '(未知路径)';
  const sz = human(selNode.size);

  if (kind === 'enter'){
    enter(selNode); return;
  }
  let text = '';
  if (kind === 'clean'){
    text = selRisk === 'caution'
      ? `帮我看看 ${p}（${sz}）里面哪些子目录能安全清理。整个目录不能删，要先进去看。`
      : `帮我清理 ${p}，它占了 ${sz}。先扫描说明里面到底有什么、哪些能安全删，再等我确认后动手。`;
  } else if (kind === 'move'){
    text = selRisk === 'caution'
      ? `${p} 整个不能搬。帮我看看里面哪些子目录（比如 Local 下某个 App 的数据）值得搬到别的盘，用 junction 建传送门。`
      : `把 ${p}（${sz}）搬到空间富余的盘，用 junction 在原位建传送门，搬完要验证相关程序还能照常使用。`;
  } else if (kind === 'path'){
    text = p;
  }
  const ok = await copyText(text);
  const old = btn.textContent;
  btn.textContent = ok ? '已复制 ✓ 去对话里粘贴' : '复制失败，请手动选中';
  btn.classList.add('ok');
  setTimeout(()=>{ btn.textContent = old; btn.classList.remove('ok'); }, 1800);
});

/* ───────── 交互 ───────── */
function hitTest(mx,my){
  for (let i=rects.length-1;i>=0;i--){
    const r = rects[i];
    if (mx>=r.x && mx<=r.x+r.w && my>=r.y && my<=r.y+r.h) return i;
  }
  return -1;
}
const tip = document.getElementById('tip');
cv.addEventListener('mousemove', e=>{
  const i = hitTest(e.clientX, e.clientY);
  if (i !== hoverIdx){ hoverIdx = i; kick(3); }
  cv.style.cursor = i>=0 ? 'pointer' : 'default';
  if (i >= 0){
    const r = rects[i], node = currentNode();
    const pct = node ? (r.size/node.size*100).toFixed(1) : '0';
    tip.querySelector('.tn').textContent = r.name;
    tip.querySelector('.tv').textContent =
      `${human(r.size)} · 占本层 ${pct}%${r.files?` · ${r.files.toLocaleString()} 个文件`:''}${r.kids?' · 双击进入':''}`;
    tip.style.left = Math.min(e.clientX+14, W-380)+'px';
    tip.style.top  = Math.min(e.clientY+14, H-96)+'px';
    tip.classList.add('on');
  } else tip.classList.remove('on');
});
cv.addEventListener('mouseleave', ()=>{ tip.classList.remove('on'); hoverIdx = -1; kick(3); });

function enter(node){
  if (!node) return;
  const kids = node.children || node.kids;
  if (!kids || !kids.length) return;
  const target = {name:node.name, path:node.path||'', size:node.size, files:node.files, children:kids};
  // 找到点击位置（用于 zoom 中心）
  const i = rects.findIndex(r=>r.path===node.path && r.name===node.name);
  const cx = i>=0 ? rects[i].x + rects[i].w/2 : W/2;
  const cy = i>=0 ? rects[i].y + rects[i].h/2 : H/2;

  closeAct();
  zoom = {cx, cy, t0:performance.now(), phase:'out'};
  kick(60);
  setTimeout(()=>{
    stack.push(target);
    relayout();          // 会重置 t0，让新一层的方块重新生长
    zoom = {cx, cy, t0:performance.now(), phase:'in'};
    updateHud();
    kick(60);
  }, 175);
}

function back(){
  if (stack.length <= 1) return;
  closeAct();
  stack.pop();
  zoom = {cx:W/2, cy:H/2, t0:performance.now(), phase:'in'};
  relayout(); updateHud(); kick(60);
}

cv.addEventListener('click', e=>{
  if (zoom) return;
  const i = hitTest(e.clientX, e.clientY);
  if (i >= 0){
    selIdx = i; hoverIdx = i;
    showAct(rects[i]); kick(6);
  } else {
    selIdx = -1; closeAct(); kick(4);
  }
});
cv.addEventListener('dblclick', e=>{
  const i = hitTest(e.clientX, e.clientY);
  if (i >= 0 && rects[i].kids) enter(rects[i]);
});
cv.addEventListener('contextmenu', e=>{ e.preventDefault(); back(); });

window.addEventListener('keydown', e=>{
  if (e.key === 'Escape'){ if (selIdx>=0){ selIdx=-1; closeAct(); kick(4);} else back(); }
});

/* ───────── 启动 ───────── */
window.addEventListener('resize', resize);
function boot(){
  stack = [DATA.tree];
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  relayout();
  updateHud();
  t0 = performance.now();
  kick(160);
  setTimeout(()=>document.getElementById('boot').classList.add('off'), 90);
}
boot();
</script>
</body>
